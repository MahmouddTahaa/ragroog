[project]
name = "clinical-rag"
version = "0.1.0"
description = "Offline corpus factory: parse, chunk, embed, and index guidelines in Chroma."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "chromadb>=1.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pymupdf>=1.25",
    "pytesseract>=0.3.13",
    "pyyaml>=6.0",
    "sentence-transformers>=3.0",
    "streamlit>=1.40",
    "torch>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
unstructured = ["unstructured>=0.16"]
llamaparse = ["llama-parse>=0.5"]
openai = ["openai>=1.0"]
cohere = ["cohere>=5.0"]
weaviate = ["weaviate-client>=4.9"]
pinecone = ["pinecone>=5.0"]
api = ["openai>=1.0", "cohere>=5.0", "llama-parse>=0.5", "weaviate-client>=4.9", "pinecone>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
package = true
